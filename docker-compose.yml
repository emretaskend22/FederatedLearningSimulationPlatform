version: '3.8'
services:
  server:
    build: .
    image: fl-platform:latest
    command: uvicorn src.server.app:app --host 0.0.0.0 --port 8000
    ports:
    - 8000:8000
    environment:
      MIN_CLIENTS: '2'
      STRATEGY: FedProx
      PARTITION: non-iid
      DP_EPSILON: '0.0'
    volumes:
    - ./results:/app/results
    networks:
    - fl-net
  client_0:
    image: fl-platform:latest
    depends_on:
    - server
    command: python src/client/train.py --client-id 0 --total-clients 2 --partition
      non-iid --dp-epsilon 0.0
    environment:
      SERVER_URL: http://server:8000
    networks:
    - fl-net
  client_1:
    image: fl-platform:latest
    depends_on:
    - server
    command: python src/client/train.py --client-id 1 --total-clients 2 --partition
      non-iid --dp-epsilon 0.0
    environment:
      SERVER_URL: http://server:8000
    networks:
    - fl-net
networks:
  fl-net:
    driver: bridge
