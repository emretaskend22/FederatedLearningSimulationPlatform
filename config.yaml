federation:
  rounds: 5
  num_clients: 2
  fraction_fit: 1.0  # Fraction of clients participating in training
  strategy: FedAvg   # or FedProx

data:
  dataset: MNIST    # or Adult
  partition: iid    # or non-iid
  non_iid_alpha: 0.5 # Dirchlet parameter for skew (if used) or simple class separation

privacy:
  enabled: false
  epsilon: 1.0
  delta: 1e-5
  max_grad_norm: 1.0

training:
  local_epochs: 1
  batch_size: 32
  learning_rate: 0.01
  proximal_mu: 0.01 # for FedProx
